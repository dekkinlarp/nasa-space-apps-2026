<script>
  // A fixed field of stars: the same picture on every render.
  let s = 20260115;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const g = document.getElementById("stars");
  for (let i = 0; i < 90; i++) {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", (rnd() * 1200).toFixed(1));
    c.setAttribute("cy", (rnd() * 630).toFixed(1));
    c.setAttribute("r", [0.6, 0.8, 1, 1.3][Math.floor(rnd() * 4)]);
    c.setAttribute("fill", "#C9D4E8");
    c.setAttribute("opacity", [0.25, 0.35, 0.5, 0.7, 0.9][Math.floor(rnd() * 5)]);
    g.appendChild(c);
  }
</script>
